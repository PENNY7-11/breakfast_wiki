<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="225" rx="130" ry="14" fill="#EADBCC" opacity="0.6"/>

  <!-- Tuna Toast -->
  <g transform="translate(130, 80)">
    <polygon points="20,130 140,20 140,130" fill="#EAD2AC" stroke="#B07D3E" stroke-width="4"/>
    <!-- Tuna & Corn mayo filling -->
    <polygon points="18,124 135,26 135,110" fill="#D7CCC8"/>
    <!-- Black pepper specks & corn -->
    <circle cx="50" cy="98" r="4" fill="#F1C40F"/>
    <circle cx="75" cy="80" r="4" fill="#F1C40F"/>
    <circle cx="100" cy="60" r="4" fill="#F1C40F"/>
    <circle cx="60" cy="90" r="1.5" fill="#3E2723"/>
    <circle cx="85" cy="70" r="1.5" fill="#3E2723"/>
    <circle cx="110" cy="50" r="1.5" fill="#3E2723"/>
    <!-- Egg slice -->
    <path d="M40,115 L125,50 L125,100 Z" fill="#FFFFFF"/>
    <circle cx="85" cy="80" r="11" fill="#FFA726"/>
    <!-- Front Toast -->
    <polygon points="5,140 125,30 125,140" fill="#FFF3CD" stroke="#B07D3E" stroke-width="4"/>
    <polygon points="12,132 118,40 118,132" fill="#FFF9E6"/>
  </g>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">鮪魚蛋吐司</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Tuna &amp; Egg Toast</text>
</svg>
