<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="225" rx="130" ry="14" fill="#EADBCC" opacity="0.6"/>
  
  <!-- Ham & Egg Toast Cut Triangle Sandwich -->
  <g transform="translate(130, 80)">
    <!-- Back Toast slice -->
    <polygon points="20,130 140,20 140,130" fill="#EAD2AC" stroke="#B07D3E" stroke-width="4"/>
    
    <!-- Filling Layer -->
    <!-- Ham slice (Pink) -->
    <polygon points="18,124 135,26 135,110" fill="#F08080"/>
    <!-- Cucumber slices (Green) -->
    <circle cx="65" cy="88" r="14" fill="#81C784" stroke="#4CAF50" stroke-width="2"/>
    <circle cx="95" cy="62" r="14" fill="#81C784" stroke="#4CAF50" stroke-width="2"/>
    <!-- Fried Egg (White & Yellow) -->
    <path d="M40,115 L125,50 L125,100 Z" fill="#FFFFFF"/>
    <circle cx="85" cy="80" r="12" fill="#FFA726"/>
    
    <!-- Front Toast slice -->
    <polygon points="5,140 125,30 125,140" fill="#FFF3CD" stroke="#B07D3E" stroke-width="4"/>
    <polygon points="12,132 118,40 118,132" fill="#FFF9E6"/>
    <!-- Grill marks -->
    <line x1="40" y1="120" x2="80" y2="80" stroke="#E6C280" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="130" x2="105" y2="85" stroke="#E6C280" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">火腿蛋吐司</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Ham &amp; Egg Toast</text>
</svg>
