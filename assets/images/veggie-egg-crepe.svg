<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="220" rx="140" ry="16" fill="#EADBCC" opacity="0.6"/>
  <ellipse cx="200" cy="155" rx="150" ry="65" fill="#FFFFFF" stroke="#E2D7C7" stroke-width="4"/>
  <ellipse cx="200" cy="155" rx="125" ry="48" fill="#FBF8F2"/>

  <!-- Crepe with Cabbage / Lettuce filling -->
  <g transform="translate(105, 125)">
    <path d="M0,8 Q95,-18 190,8 L185,36 Q95,18 0,36 Z" fill="#FEECA9" stroke="#E5BD52" stroke-width="3"/>
    <!-- Veggie shreds (Cabbage & carrot) -->
    <path d="M20,18 Q95,0 170,18" stroke="#81C784" stroke-width="8" stroke-linecap="round"/>
    <path d="M25,23 Q95,8 165,23" stroke="#4CAF50" stroke-width="6" stroke-linecap="round"/>
    <!-- Carrot threads -->
    <path d="M40,15 L55,24" stroke="#FF7043" stroke-width="3" stroke-linecap="round"/>
    <path d="M85,13 L105,22" stroke="#FF7043" stroke-width="3" stroke-linecap="round"/>
    <path d="M130,16 L148,25" stroke="#FF7043" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">蔬菜蛋餅</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Fresh Cabbage Egg Crepe</text>
</svg>
