<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="225" rx="135" ry="15" fill="#EADBCC" opacity="0.6"/>

  <!-- Plate -->
  <ellipse cx="200" cy="155" rx="145" ry="58" fill="#FFFFFF" stroke="#E2D7C7" stroke-width="4"/>
  <ellipse cx="200" cy="155" rx="122" ry="44" fill="#FBF8F2"/>

  <!-- Two Golden Pan-fried Turnip Cake Cubes / Slices -->
  <g transform="translate(110, 115)">
    <!-- Piece 1 (Left Back) -->
    <polygon points="15,40 65,15 110,35 60,60" fill="#F4EAE0" stroke="#BCAAA4" stroke-width="2"/>
    <polygon points="15,40 60,60 60,78 15,58" fill="#EFEBE9"/>
    <polygon points="60,60 110,35 110,53 60,78" fill="#D7CCC8"/>
    <!-- Pan sear marks -->
    <ellipse cx="62" cy="38" rx="28" ry="12" fill="#D4AC0D" opacity="0.6"/>
    <ellipse cx="62" cy="38" rx="18" ry="7" fill="#BA4A00" opacity="0.5"/>

    <!-- Piece 2 (Right Front) -->
    <polygon points="75,50 125,25 170,45 120,70" fill="#F4EAE0" stroke="#BCAAA4" stroke-width="2"/>
    <polygon points="75,50 120,70 120,90 75,70" fill="#EFEBE9"/>
    <polygon points="120,70 170,45 170,65 120,90" fill="#D7CCC8"/>
    <!-- Crispy golden crust -->
    <ellipse cx="122" cy="48" rx="28" ry="12" fill="#D4AC0D" opacity="0.7"/>
    <ellipse cx="122" cy="48" rx="18" ry="7" fill="#BA4A00" opacity="0.6"/>

    <!-- Thick garlic soy paste puddle -->
    <ellipse cx="40" cy="65" rx="15" ry="7" fill="#4E342E" opacity="0.85"/>
  </g>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">港式蘿蔔糕</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Pan-Fried Turnip Cake</text>
</svg>
