<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="220" rx="140" ry="16" fill="#EADBCC" opacity="0.6"/>
  <!-- Plate -->
  <ellipse cx="200" cy="155" rx="150" ry="65" fill="#FFFFFF" stroke="#E2D7C7" stroke-width="4"/>
  <ellipse cx="200" cy="155" rx="125" ry="48" fill="#FBF8F2"/>

  <!-- Crepe with Melting Cheese pull -->
  <g transform="translate(105, 125)">
    <!-- Crepe roll base -->
    <path d="M0,8 Q95,-18 190,8 L185,36 Q95,18 0,36 Z" fill="#FEECA9" stroke="#E5BD52" stroke-width="3"/>
    <!-- Molten Cheese layer -->
    <path d="M15,16 Q95,-4 175,16 L170,28 Q95,12 15,28 Z" fill="#FFB74D"/>
    <!-- Melty cheese drips -->
    <path d="M45,28 Q50,42 55,28 Q70,48 78,28 Q120,50 128,26 Q145,45 152,28" fill="#FFA726"/>
    <!-- Golden brown blisters on crepe -->
    <ellipse cx="30" cy="12" rx="6" ry="3" fill="#E59866" opacity="0.7"/>
    <ellipse cx="105" cy="8" rx="8" ry="4" fill="#E59866" opacity="0.7"/>
    <ellipse cx="160" cy="15" rx="7" ry="3.5" fill="#E59866" opacity="0.7"/>
  </g>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">起司蛋餅</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Melted Cheese Egg Crepe</text>
</svg>
