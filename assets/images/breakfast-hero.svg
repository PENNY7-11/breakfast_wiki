<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="100%" stop-color="#F5EFE6"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5D4037" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Table surface -->
  <rect width="600" height="320" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle placemat -->
  <rect x="50" y="70" width="500" height="200" rx="20" fill="#FFFFFF" opacity="0.7"/>
  <rect x="58" y="78" width="484" height="184" rx="16" fill="none" stroke="#E2D7C7" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Plate Left (Toast & Egg) -->
  <g transform="translate(140, 165)" filter="url(#softShadow)">
    <!-- Plate -->
    <ellipse cx="0" cy="0" rx="90" ry="65" fill="#FAFAFA" stroke="#E0D6C8" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="72" ry="50" fill="#F0EBE1"/>

    <!-- Toast Bread -->
    <path d="M-55,-25 C-55,-40 -35,-48 -15,-48 C5,-48 25,-40 25,-25 L25,18 C25,28 15,35 0,35 C-15,35 -55,28 -55,18 Z" fill="#D7A15C" stroke="#A96B28" stroke-width="3"/>
    <path d="M-47,-20 C-47,-32 -30,-40 -15,-40 C0,-40 17,-32 17,-20 L17,14 C17,20 10,27 0,27 C-10,27 -47,20 -47,14 Z" fill="#FCEAC7"/>

    <!-- Fried Sunny Egg -->
    <ellipse cx="8" cy="-5" rx="36" ry="28" fill="#FFFFFF" stroke="#E0D2C0" stroke-width="2"/>
    <circle cx="10" cy="-6" r="15" fill="#FFA726"/>
    <circle cx="6" cy="-10" r="4.5" fill="#FFF3E0" opacity="0.8"/>
    <!-- Herbs sprinkle -->
    <circle cx="22" cy="12" r="1.5" fill="#66BB6A"/>
    <circle cx="-5" cy="15" r="1.8" fill="#66BB6A"/>
    <circle cx="25" cy="-20" r="1.5" fill="#66BB6A"/>
  </g>

  <!-- Coffee Mug Right -->
  <g transform="translate(350, 160)" filter="url(#softShadow)">
    <!-- Plate under mug -->
    <ellipse cx="0" cy="50" rx="55" ry="18" fill="#F5F2ED" stroke="#D7C9B8" stroke-width="3"/>
    <!-- Mug Body -->
    <path d="M-36,-30 L-30,42 C-30,48 -20,54 0,54 C20,54 30,48 30,42 L36,-30 Z" fill="#5D4037" stroke="#3E2723" stroke-width="3"/>
    <!-- Handle -->
    <path d="M32,-15 C52,-15 52,25 28,30" fill="none" stroke="#3E2723" stroke-width="7" stroke-linecap="round"/>
    <path d="M32,-15 C52,-15 52,25 28,30" fill="none" stroke="#5D4037" stroke-width="4" stroke-linecap="round"/>
    <!-- Coffee Surface -->
    <ellipse cx="0" cy="-30" rx="36" ry="12" fill="#8D6E63" stroke="#3E2723" stroke-width="2"/>
    <ellipse cx="0" cy="-30" rx="30" ry="9" fill="#3E2723"/>
    <!-- Latte Foam Art Heart -->
    <path d="M0,-34 C-6,-40 -12,-34 -12,-28 C-12,-22 0,-18 0,-18 C0,-18 12,-22 12,-28 C12,-34 6,-40 0,-34 Z" fill="#FFF3E0" opacity="0.9"/>

    <!-- Steaming Aroma -->
    <path d="M-10,-55 Q-16,-75 -8,-95" fill="none" stroke="#BCAAA4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    <path d="M6,-52 Q15,-72 8,-98" fill="none" stroke="#BCAAA4" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Utensils (Fork / Spoon) -->
  <g transform="translate(470, 160)" filter="url(#softShadow)" opacity="0.85">
    <!-- Fork -->
    <rect x="-8" y="-45" width="4" height="95" rx="2" fill="#CFD8DC"/>
    <path d="M-16,-45 L-16,-60 L-13,-60 L-13,-45 L-9,-45 L-9,-60 L-7,-60 L-7,-45 L-3,-45 L-3,-60 L0,-60 L0,-45 Z" fill="#B0BEC5"/>
  </g>

  <!-- Little Breakfast Badge -->
  <g transform="translate(300, 48)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="#FFE8A3" stroke="#F6C85F" stroke-width="2"/>
    <text x="0" y="5" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="14" fill="#5D4037" text-anchor="middle">
      ☀️ 台灣在地早餐活力百科
    </text>
  </g>
</svg>
