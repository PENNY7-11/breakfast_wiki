<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="225" rx="110" ry="14" fill="#EADBCC" opacity="0.6"/>

  <!-- Taiwanese Black Tea Cup with sealed film plastic cup -->
  <g transform="translate(150, 75)">
    <!-- Cup Body -->
    <path d="M15,20 L25,130 C25,138 35,142 50,142 C65,142 75,138 75,130 L85,20 Z" fill="#78281F" stroke="#E0D2B4" stroke-width="3"/>
    
    <!-- Transparent cup highlight -->
    <path d="M22,30 L28,125" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
    
    <!-- Sealed Cup Lid Film (Classic red plastic sealing film) -->
    <ellipse cx="50" cy="20" rx="36" ry="8" fill="#E74C3C" stroke="#C0392B" stroke-width="2"/>
    <ellipse cx="50" cy="20" rx="30" ry="6" fill="#EC7063"/>

    <!-- Red Straw poked through film -->
    <path d="M52,20 L70,-15" stroke="#FF5722" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Ice cubes visible -->
    <rect x="35" y="45" width="16" height="16" rx="3" fill="#FFFFFF" opacity="0.25"/>
    <rect x="52" y="65" width="18" height="18" rx="3" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">古早味紅茶</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Taiwanese Traditional Black Tea</text>
</svg>
