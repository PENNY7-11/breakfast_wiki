<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="225" rx="120" ry="14" fill="#EADBCC" opacity="0.6"/>

  <!-- Crispy Golden Hash Brown (Oval shaped with potato texture) -->
  <g transform="translate(140, 90)">
    <!-- Base Oval Hash Brown -->
    <path d="M20,60 C-10,35 15,10 60,10 C105,10 130,35 100,60 C70,85 45,80 20,60 Z" fill="#F39C12" stroke="#B9770E" stroke-width="3.5"/>
    <path d="M24,56 C2,35 20,16 60,16 C100,16 122,35 96,56 C70,78 46,74 24,56 Z" fill="#F8C471"/>
    
    <!-- Crispy shredded potato textures -->
    <line x1="35" y1="30" x2="55" y2="28" stroke="#D68910" stroke-width="2" stroke-linecap="round"/>
    <line x1="65" y1="26" x2="85" y2="30" stroke="#D68910" stroke-width="2" stroke-linecap="round"/>
    <line x1="45" y1="42" x2="70" y2="40" stroke="#D68910" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="52" x2="52" y2="48" stroke="#D68910" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="54" x2="88" y2="50" stroke="#D68910" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Red Ketchup Drizzle -->
    <path d="M20,38 Q45,20 60,40 T100,35" fill="none" stroke="#E74C3C" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">香酥薯餅</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Golden Crispy Hash Brown</text>
</svg>
