<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="225" rx="140" ry="16" fill="#EADBCC" opacity="0.6"/>

  <!-- Sizzling Teppan Hot Plate (Black oval plate on wooden base) -->
  <!-- Wooden base -->
  <path d="M50,175 C50,145 350,145 350,175 C350,205 50,205 50,175 Z" fill="#8D6E63"/>
  <!-- Cast iron plate -->
  <ellipse cx="200" cy="165" rx="135" ry="40" fill="#37474F" stroke="#263238" stroke-width="4"/>
  <ellipse cx="200" cy="165" rx="122" ry="32" fill="#212121"/>

  <!-- Noodles (Swirling yellow-brown noodles) -->
  <g transform="translate(100, 140)">
    <!-- Noodles tangled paths -->
    <path d="M20,15 Q60,-5 100,18 Q140,0 180,20" fill="none" stroke="#F4D03F" stroke-width="6" stroke-linecap="round"/>
    <path d="M15,25 Q55,40 110,15 Q150,35 190,15" fill="none" stroke="#E59866" stroke-width="6" stroke-linecap="round"/>
    <path d="M30,30 Q90,5 150,30" fill="none" stroke="#F5B041" stroke-width="6" stroke-linecap="round"/>
    <path d="M35,18 Q80,35 130,22 Q170,10 185,28" fill="none" stroke="#F4D03F" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Black pepper sauce specks -->
    <circle cx="45" cy="20" r="2" fill="#2C3E50"/>
    <circle cx="70" cy="12" r="2" fill="#2C3E50"/>
    <circle cx="95" cy="24" r="2" fill="#2C3E50"/>
    <circle cx="120" cy="16" r="2" fill="#2C3E50"/>
    <circle cx="150" cy="22" r="2" fill="#2C3E50"/>
    <circle cx="80" cy="30" r="1.5" fill="#2C3E50"/>
    <circle cx="135" cy="32" r="1.5" fill="#2C3E50"/>

    <!-- Sunny Side Up Egg on top -->
    <ellipse cx="60" cy="12" rx="26" ry="18" fill="#FFFFFF"/>
    <circle cx="60" cy="12" r="9" fill="#FFA726"/>
    <circle cx="57" cy="9" r="3" fill="#FFF3E0" opacity="0.8"/>
  </g>

  <!-- Steam lines -->
  <path d="M175,115 Q165,95 178,75" fill="none" stroke="#B0BEC5" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M225,110 Q238,90 226,70" fill="none" stroke="#B0BEC5" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">黑胡椒鐵板麵</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Black Pepper Teppan Noodles</text>
</svg>
