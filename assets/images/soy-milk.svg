<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="225" rx="110" ry="14" fill="#EADBCC" opacity="0.6"/>

  <!-- Soy Milk Cup / Glass with Straw -->
  <g transform="translate(150, 75)">
    <!-- Cup Body (Clear cup with creamy warm white milk) -->
    <path d="M15,20 L25,130 C25,138 35,142 50,142 C65,142 75,138 75,130 L85,20 Z" fill="#FFFBE6" stroke="#E0D2B4" stroke-width="3"/>
    
    <!-- Soy Milk Level -->
    <path d="M18,35 L26,128 C26,134 35,138 50,138 C65,138 74,134 74,128 L82,35 Z" fill="#FFF9C4" opacity="0.8"/>
    <!-- Surface rim ellipse -->
    <ellipse cx="50" cy="20" rx="35" ry="8" fill="#F9F6EE" stroke="#E0D2B4" stroke-width="2"/>
    <ellipse cx="50" cy="35" rx="32" ry="6" fill="#FFF59D" opacity="0.6"/>

    <!-- Striped Straw (Gentle green/white) -->
    <path d="M55,30 L75,-15" stroke="#81C784" stroke-width="6" stroke-linecap="round"/>
    <path d="M55,30 L75,-15" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="6 6" stroke-linecap="round"/>

    <!-- Soy bean icon on cup -->
    <circle cx="50" cy="85" r="14" fill="#FFE082" opacity="0.7"/>
    <ellipse cx="48" cy="84" rx="5" ry="7" transform="rotate(-20 48 84)" fill="#F57F17"/>
    <ellipse cx="53" cy="87" rx="5" ry="7" transform="rotate(20 53 87)" fill="#F57F17"/>
  </g>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">無糖高纖豆漿</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Sugar-free Soy Milk</text>
</svg>
