<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="225" rx="130" ry="14" fill="#EADBCC" opacity="0.6"/>

  <!-- Teriyaki Pork Burger -->
  <g transform="translate(140, 85)">
    <!-- Bottom Bun -->
    <path d="M10,105 Q60,118 110,105 L108,122 Q60,135 12,122 Z" fill="#E5A65D" stroke="#A86E2A" stroke-width="3"/>
    
    <!-- Pork Patty (Dark glaze) -->
    <path d="M8,90 Q60,82 112,90 L110,104 Q60,112 10,104 Z" fill="#6E2C00" stroke="#4A235A" stroke-width="2"/>
    <!-- Teriyaki Glaze Shine -->
    <path d="M25,93 Q60,88 95,93" stroke="#BA4A00" stroke-width="3" stroke-linecap="round"/>

    <!-- Onion & Cucumber slices -->
    <rect x="25" y="82" width="20" height="4" rx="2" fill="#E1BEE7"/>
    <rect x="55" y="81" width="22" height="4" rx="2" fill="#81C784"/>
    <rect x="80" y="83" width="18" height="4" rx="2" fill="#E1BEE7"/>

    <!-- Egg or Lettuce -->
    <path d="M10,72 Q60,78 110,72 Q115,80 110,84 Q60,88 10,84 Z" fill="#66BB6A"/>

    <!-- Top Bun -->
    <path d="M5,68 C5,20 115,20 115,68 Z" fill="#F5B041" stroke="#A86E2A" stroke-width="3"/>
    <!-- Sesame Seeds -->
    <ellipse cx="45" cy="42" rx="2" ry="4" transform="rotate(20 45 42)" fill="#FFFDE7"/>
    <ellipse cx="75" cy="40" rx="2" ry="4" transform="rotate(-10 75 40)" fill="#FFFDE7"/>
    <ellipse cx="60" cy="52" rx="2" ry="4" fill="#FFFDE7"/>
  </g>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">照燒豬肉堡</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Teriyaki Pork Burger</text>
</svg>
