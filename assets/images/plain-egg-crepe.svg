<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="220" rx="140" ry="16" fill="#EADBCC" opacity="0.6"/>
  <!-- Plate -->
  <ellipse cx="200" cy="155" rx="150" ry="65" fill="#FFFFFF" stroke="#E2D7C7" stroke-width="4"/>
  <ellipse cx="200" cy="155" rx="125" ry="48" fill="#FBF8F2"/>
  
  <!-- Egg Crepe Slices (Roll cut into pieces) -->
  <!-- Slice 1 -->
  <g transform="translate(100, 135)">
    <path d="M0,0 Q18,-15 36,0 L32,22 Q16,35 0,22 Z" fill="#FBE6A2" stroke="#E5BD52" stroke-width="2.5"/>
    <ellipse cx="18" cy="2" rx="14" ry="7" fill="#F39C12"/>
    <ellipse cx="18" cy="2" rx="9" ry="4" fill="#F1C40F"/>
  </g>
  <!-- Slice 2 -->
  <g transform="translate(136, 130)">
    <path d="M0,0 Q20,-16 40,0 L36,24 Q18,38 0,24 Z" fill="#FEECA9" stroke="#E5BD52" stroke-width="2.5"/>
    <ellipse cx="20" cy="2" rx="16" ry="8" fill="#F39C12"/>
    <ellipse cx="20" cy="2" rx="11" ry="5" fill="#F1C40F"/>
    <!-- Scallion bits -->
    <rect x="8" y="10" width="4" height="4" rx="1" fill="#4CAF50"/>
    <rect x="25" y="14" width="4" height="3" rx="1" fill="#388E3C"/>
  </g>
  <!-- Slice 3 (Center) -->
  <g transform="translate(180, 128)">
    <path d="M0,0 Q22,-16 44,0 L40,25 Q20,40 0,25 Z" fill="#FBE6A2" stroke="#E5BD52" stroke-width="2.5"/>
    <ellipse cx="22" cy="2" rx="17" ry="8.5" fill="#F39C12"/>
    <ellipse cx="22" cy="2" rx="12" ry="5" fill="#F5B041"/>
    <!-- Scallion bits -->
    <rect x="15" y="12" width="5" height="3" rx="1" fill="#388E3C"/>
  </g>
  <!-- Slice 4 -->
  <g transform="translate(226, 132)">
    <path d="M0,0 Q20,-15 40,0 L36,23 Q18,36 0,23 Z" fill="#FEECA9" stroke="#E5BD52" stroke-width="2.5"/>
    <ellipse cx="20" cy="2" rx="15" ry="7.5" fill="#F39C12"/>
    <ellipse cx="20" cy="2" rx="10" ry="4" fill="#F1C40F"/>
  </g>
  <!-- Slice 5 -->
  <g transform="translate(268, 138)">
    <path d="M0,0 Q18,-14 36,0 L32,20 Q16,32 0,20 Z" fill="#FBE6A2" stroke="#E5BD52" stroke-width="2.5"/>
    <ellipse cx="18" cy="2" rx="13" ry="6.5" fill="#F39C12"/>
  </g>
  <!-- Soy sauce paste drizzle -->
  <path d="M120,132 Q190,120 280,145" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  
  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">原味蛋餅</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Classic Plain Egg Crepe</text>
</svg>
