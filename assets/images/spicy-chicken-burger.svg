<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="225" rx="130" ry="14" fill="#EADBCC" opacity="0.6"/>

  <!-- Crispy Chicken Burger -->
  <g transform="translate(140, 85)">
    <!-- Bottom Bun -->
    <path d="M10,105 Q60,118 110,105 L108,122 Q60,135 12,122 Z" fill="#E5A65D" stroke="#A86E2A" stroke-width="3"/>
    
    <!-- Fried Crispy Chicken Patty (Golden crunchy edges) -->
    <path d="M5,88 Q20,80 40,84 Q65,75 90,82 Q115,80 115,96 Q90,104 60,100 Q30,105 5,96 Z" fill="#D35400" stroke="#BA4A00" stroke-width="2.5"/>
    <circle cx="25" cy="90" r="2.5" fill="#F39C12"/>
    <circle cx="55" cy="92" r="3" fill="#F39C12"/>
    <circle cx="85" cy="88" r="2.5" fill="#F39C12"/>
    
    <!-- Lettuce (Green waves) -->
    <path d="M0,74 Q25,82 50,75 Q80,82 120,72 Q125,82 115,86 Q60,90 5,86 Z" fill="#66BB6A"/>
    
    <!-- Mayo / Sauce Drip -->
    <ellipse cx="45" cy="74" rx="7" ry="3" fill="#FFF9C4"/>
    <ellipse cx="80" cy="75" rx="9" ry="3" fill="#FFF9C4"/>

    <!-- Top Bun (Dome with sesame seeds) -->
    <path d="M5,68 C5,20 115,20 115,68 Z" fill="#F5B041" stroke="#A86E2A" stroke-width="3"/>
    <!-- Sesame Seeds -->
    <ellipse cx="40" cy="42" rx="2" ry="4" transform="rotate(25 40 42)" fill="#FFFDE7"/>
    <ellipse cx="60" cy="34" rx="2" ry="4" transform="rotate(-15 60 34)" fill="#FFFDE7"/>
    <ellipse cx="80" cy="45" rx="2" ry="4" transform="rotate(20 80 45)" fill="#FFFDE7"/>
    <ellipse cx="50" cy="52" rx="2" ry="4" transform="rotate(-30 50 52)" fill="#FFFDE7"/>
    <ellipse cx="70" cy="53" rx="2" ry="4" transform="rotate(10 70 53)" fill="#FFFDE7"/>
  </g>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">卡啦雞腿堡</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Crispy Spicy Chicken Burger</text>
</svg>
