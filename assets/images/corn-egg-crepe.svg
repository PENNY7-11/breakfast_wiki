<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="220" rx="140" ry="16" fill="#EADBCC" opacity="0.6"/>
  <!-- Plate -->
  <ellipse cx="200" cy="155" rx="150" ry="65" fill="#FFFFFF" stroke="#E2D7C7" stroke-width="4"/>
  <ellipse cx="200" cy="155" rx="125" ry="48" fill="#FBF8F2"/>
  
  <!-- Crepe Roll with Corn kernels popping out -->
  <g transform="translate(110, 130)">
    <path d="M0,5 Q90,-20 180,5 L175,32 Q90,15 0,32 Z" fill="#FEECA9" stroke="#E5BD52" stroke-width="3"/>
    <!-- Egg layer -->
    <path d="M10,12 Q90,-8 170,12" fill="none" stroke="#F39C12" stroke-width="6"/>
    <!-- Corn Kernels -->
    <circle cx="35" cy="10" r="5" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1.5"/>
    <circle cx="65" cy="5" r="5.5" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1.5"/>
    <circle cx="95" cy="3" r="5" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1.5"/>
    <circle cx="125" cy="6" r="5.5" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1.5"/>
    <circle cx="155" cy="12" r="5" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1.5"/>
    <circle cx="50" cy="20" r="4.5" fill="#F1C40F"/>
    <circle cx="110" cy="18" r="4.5" fill="#F1C40F"/>
    <!-- Scallion sprinkles -->
    <rect x="75" y="15" width="4" height="4" rx="1" fill="#4CAF50"/>
    <rect x="135" y="18" width="4" height="4" rx="1" fill="#388E3C"/>
  </g>
  <!-- Sauce swirl -->
  <path d="M130,122 Q190,110 260,132" fill="none" stroke="#5D4037" stroke-width="3" stroke-linecap="round" opacity="0.75"/>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">玉米蛋餅</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Sweet Corn Egg Crepe</text>
</svg>
