<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" rx="16" fill="#FFFDF9"/>
  <ellipse cx="200" cy="225" rx="110" ry="14" fill="#EADBCC" opacity="0.6"/>

  <!-- Taiwanese Breakfast Milk Tea (Milk tea color) -->
  <g transform="translate(150, 75)">
    <!-- Cup Body (Rich creamy caramel brown) -->
    <path d="M15,20 L25,130 C25,138 35,142 50,142 C65,142 75,138 75,130 L85,20 Z" fill="#D2B48C" stroke="#A07855" stroke-width="3"/>
    
    <!-- Highlights -->
    <path d="M22,30 L28,125" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    
    <!-- Sealed Cup Lid Film (Warm yellow floral sealing film) -->
    <ellipse cx="50" cy="20" rx="36" ry="8" fill="#F1C40F" stroke="#D4AC0D" stroke-width="2"/>
    <ellipse cx="50" cy="20" rx="30" ry="6" fill="#F9E79F"/>

    <!-- Striped Red/White Straw poked through -->
    <path d="M52,20 L70,-15" stroke="#E74C3C" stroke-width="6" stroke-linecap="round"/>
    <path d="M52,20 L70,-15" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="6 6" stroke-linecap="round"/>
    
    <!-- Ice cubes visible -->
    <rect x="34" y="48" width="16" height="16" rx="3" fill="#FFFFFF" opacity="0.25"/>
    <rect x="52" y="70" width="18" height="18" rx="3" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <text x="200" y="42" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-weight="bold" font-size="18" fill="#5D4037" text-anchor="middle">經典台式奶茶</text>
  <text x="200" y="65" font-family="'PingFang TC', 'Microsoft JhengHei', sans-serif" font-size="13" fill="#8D6E63" text-anchor="middle">Classic Breakfast Milk Tea</text>
</svg>
